[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "bass-cr-reference"
version = "0.1.0"
description = "Scoped BASS_CR MODEL/reference kernels, not a physical source certificate"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy"]
[tool.setuptools.packages.find]
include = ["cr_reion*"]
